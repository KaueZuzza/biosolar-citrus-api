spring:
  application:
    name: biosolar-citrus-api
  config:
    # Configuracao local da maquina (.env na raiz do projeto, ver .env.example). Variaveis de ambiente
    # do sistema continuam tendo prioridade. "./" cobre a execucao a partir da raiz; "../", a partir de backend/.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${BIOSOLAR_DB_URL:jdbc:postgresql://localhost:5432/biosolar}
    username: ${BIOSOLAR_DB_USUARIO:biosolar}
    password: ${BIOSOLAR_DB_SENHA:biosolar}
    hikari:
      maximum-pool-size: 10
      # Curto de proposito: com o banco fora do ar, cada tentativa de gravacao segura o lock do estado
      # por no maximo este tempo (depois o EstadoFazendaService espera 10 s antes de tentar de novo)
      connection-timeout: 3000
  jpa:
    # O schema e controlado exclusivamente pelo Flyway (src/main/resources/db/migration)
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      # ../frontend primeiro: editar o dashboard nao exige rebuild durante o desenvolvimento
      # "../frontend" quando a API roda a partir de backend/ (scripts, F5 no VS Code); "./frontend" quando roda a
      # partir da raiz do projeto (botao Run do VS Code). Sem nenhum dos dois, usa a copia empacotada no jar.
      static-locations: file:../frontend/, file:./frontend/, classpath:/static/
      # O navegador sempre revalida o dashboard: evita exibir arquivos antigos apos uma atualizacao (git pull)
      cache:
        cachecontrol:
          no-cache: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true

biosolar:
  cors:
    # Padrao de DESENVOLVIMENTO: qualquer porta em localhost/127.0.0.1 (ex.: Live Server) e "null"
    # (dashboard aberto como arquivo). O dashboard servido pela propria API (porta 8080) nao depende de CORS.
    # Lista separada por virgula. Ex.: BIOSOLAR_CORS_ORIGENS=https://biosolar.exemplo.com
    origens-permitidas: "${BIOSOLAR_CORS_ORIGENS:http://localhost:[*],http://127.0.0.1:[*],null}"
  simulacao:
    habilitada: true
    intervalo-ms: 1000
    # 1 ciclo (1 s real) = 1 minuto simulado; o fator de velocidade multiplica esse valor
    minutos-por-tick: 1
    registrar-leitura-a-cada-ticks: 2
    # Leituras de telemetria (graficos) mais antigas que isso sao removidas; o historico de EVENTOS e mantido
    retencao-leituras-horas: 24
    # Intervalo para trazer a automacao o cadastro alterado diretamente no banco (ex.: pelo pgAdmin)
    sincronizacao-cadastro-ms: 5000
    # Endpoints /simulacao/* existem apenas para a demonstracao. Use false para desativa-los.
    controles-demonstracao: ${BIOSOLAR_CONTROLES_DEMO:true}
    hora-inicial: 9

logging:
  level:
    br.com.biosolar: INFO
